name: build-iso
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential gcc-multilib grub-pc-bin xorriso mtools
      - run: sed -i 's/\r$//' *.sh Makefile boot.S linker.ld grub/grub.cfg && sh build-iso.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeOS-iso
          path: ClaudeOS.iso
